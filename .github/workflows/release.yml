name: Release

# Triggered by a version tag such as v1.0.0, or manually from the Actions tab.
# Produces:
#   - framework-dependent binaries with a native apphost (Windows / Linux x64 / arm64)
#   - a multi-arch container image pushed to GitHub Container Registry
#   - a GitHub Release with the archives attached
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading "v" (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write    # create the GitHub Release
  packages: write    # push to ghcr.io

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------------------
  # Binaries: one framework-dependent zip per platform (native apphost included)
  # -------------------------------------------------------------------------
  binaries:
    name: Binaries (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            asset: windows-x64
          - rid: linux-x64
            asset: linux-x64
          - rid: linux-arm64
            asset: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VALUE="${RAW#v}"
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VALUE"

      - name: Publish (framework-dependent, with native apphost)
        run: |
          dotnet publish ApiGateway.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -p:Version=${{ steps.version.outputs.value }} \
            -p:UseAppHost=true \
            -p:PublishReadyToRun=false \
            -o ./publish

      - name: Verify the native executable was produced
        run: |
          set -e
          case "${{ matrix.rid }}" in
            win-*) EXE="./publish/ApiGateway.exe" ;;
            *)     EXE="./publish/ApiGateway" ;;
          esac

          if [ ! -f "$EXE" ]; then
            echo "::error::Native executable '$EXE' was not produced."
            echo "::error::Check that UseAppHost is true and DebugType is not 'none'."
            ls -la ./publish | head -40
            exit 1
          fi
          echo "OK: $EXE exists ($(stat -c%s "$EXE") bytes)"

      - name: Verify no secrets or databases were published
        run: |
          set -e
          FAILED=0
          if find ./publish -name "identity.db*" | grep -q .; then
            echo "::error::Database file found in publish output"; FAILED=1
          fi
          if find ./publish \( -name "*.p12" -o -name "*.pfx" -o -name "*.pem" \) | grep -q .; then
            echo "::error::Certificate found in publish output"; FAILED=1
          fi
          if find ./publish -name "appsettings.Development.json" | grep -q .; then
            echo "::error::appsettings.Development.json found in publish output."
            echo "::error::Set <CopyToPublishDirectory>Never</CopyToPublishDirectory> for it in ApiGateway.csproj."
            FAILED=1
          fi
          if grep -rIl --include="*.json" '"SecretKey"[[:space:]]*:[[:space:]]*"[^"]\+"' ./publish 2>/dev/null | grep -q .; then
            echo "::error::Non-empty SecretKey found in published configuration"; FAILED=1
          fi
          exit $FAILED

      - name: Package
        run: |
          set -e
          ARCHIVE="ocelot-admin-${{ steps.version.outputs.value }}-${{ matrix.asset }}.zip"

          # `zip` does not preserve the Unix executable bit, so mark the apphost as
          # executable and let Info-ZIP record the permission in the central directory.
          case "${{ matrix.rid }}" in
            win-*) ;;
            *) chmod +x ./publish/ApiGateway ;;
          esac

          cd publish
          zip -r "../$ARCHIVE" .
          cd ..

          echo "Created $ARCHIVE"
          ls -lh "$ARCHIVE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.rid }}
          path: ocelot-admin-*.zip
          retention-days: 1

  # -------------------------------------------------------------------------
  # Container image: multi-arch, pushed to ghcr.io
  # -------------------------------------------------------------------------
  image:
    name: Container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          echo "value=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.value }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # GitHub Release with all binaries attached
  # -------------------------------------------------------------------------
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [binaries, image]

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VALUE="${RAW#v}"
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VALUE" >> "$GITHUB_OUTPUT"

      # Only the binary archives: build-push-action also stores a GHA cache
      # artifact (named <owner>~<repo>~<id>.dockerbuild) that cannot be extracted.
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: binaries-*

      - name: Verify the expected archives are present
        run: |
          set -e
          echo "Downloaded files:"
          ls -lh artifacts

          EXPECTED=3
          COUNT=$(find artifacts -maxdepth 1 -name 'ocelot-admin-*.zip' | wc -l)
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED archives, found $COUNT."
            exit 1
          fi
          echo "OK: $COUNT archives ready to attach."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: artifacts/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          body: |
            ## Ocelot Admin v${{ steps.version.outputs.value }}

            ### Container image
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
            docker run -p 4000:8080 \
              -e AppSetting__AdminApi__SigningKey="<your-key>" \
              ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
            ```

            ### Binaries

            **Requires the ASP.NET Core Runtime 10.0** — download it from
            <https://dotnet.microsoft.com/download/dotnet/10.0>
            (choose *ASP.NET Core Runtime*, not the plain .NET Runtime).

            | Archive | Run |
            |---|---|
            | `windows-x64` | `ApiGateway.exe` |
            | `linux-x64` / `linux-arm64` | `chmod +x ApiGateway && ./ApiGateway` |

            The Linux archives do not preserve the executable bit, so the `chmod`
            is required once after extracting.

            The admin panel is served at `/admin` (default `http://localhost:4000/admin`).

            ### Plugin contract
            ```bash
            dotnet add package ocelot-admin-plugin --version ${{ steps.version.outputs.value }}
            ```
