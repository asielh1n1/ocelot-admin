name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Restore by project rather than by solution: the .sln is for local
      # development, and a stray local project reference must never break CI.
      - name: Restore
        run: dotnet restore ApiGateway.csproj

      - name: Build (Release)
        run: dotnet build ApiGateway.csproj -c Release --no-restore

      # The sample plugin is the executable specification of the contract: if it
      # stops compiling, the plugin API changed and the docs need updating.
      - name: Build sample plugin
        run: dotnet build samples/SamplePlugin/SamplePlugin.csproj -c Release

      - name: Verify plugin isolation
        run: |
          set -e
          OUT="samples/SamplePlugin/bin/Release/net10.0"
          if ls "$OUT"/ApiGateway.Contracts.dll 2>/dev/null; then
            echo "::error::The sample plugin shipped ApiGateway.Contracts.dll."
            echo "::error::Add ExcludeAssets=runtime and Private=false to its reference."
            exit 1
          fi
          echo "OK: contract assembly is not bundled with the plugin."

      # Guards the release artifacts: a build must never contain secrets or a database.
      - name: Verify publish output is clean
        run: |
          set -e
          dotnet publish ApiGateway.csproj -c Release -o ./publish-out --no-restore

          echo "Checking for sensitive files in the publish output..."
          FAILED=0

          if find ./publish-out -name "identity.db*" | grep -q .; then
            echo "::error::Database file found in publish output"; FAILED=1
          fi
          if find ./publish-out \( -name "*.p12" -o -name "*.pfx" -o -name "*.pem" \) | grep -q .; then
            echo "::error::Certificate found in publish output"; FAILED=1
          fi
          if find ./publish-out -name "appsettings.Development.json" | grep -q .; then
            echo "::error::appsettings.Development.json found in publish output."
            echo "::error::Set <CopyToPublishDirectory>Never</CopyToPublishDirectory> for it in ApiGateway.csproj."
            FAILED=1
          fi

          # Belt and braces: no non-empty SecretKey anywhere in the published JSON.
          if grep -rIl --include="*.json" '"SecretKey"[[:space:]]*:[[:space:]]*"[^"]\+"' ./publish-out 2>/dev/null | grep -q .; then
            echo "::error::A non-empty SecretKey was published. Remove it from appsettings.json."
            grep -rIn --include="*.json" '"SecretKey"[[:space:]]*:[[:space:]]*"[^"]\+"' ./publish-out || true
            FAILED=1
          fi

          # Shipped configuration must be self-consistent: every authentication provider
          # referenced by ocelot.json has to be registered in appsettings.json, otherwise
          # Ocelot aborts at startup and the container never answers /health.
          #
          # The publish step generates ocelot.json from the built-in defaults (it is
          # git-ignored runtime state), so that generated file is what gets validated.
          exit $FAILED

      - name: Verify route authentication providers are configured
        run: |
          python3 - <<'PY'
          import json, sys

          with open('./publish-out/ocelot.json', encoding='utf-8') as fh:
              routes = json.load(fh).get('Routes', [])
          with open('./publish-out/appsettings.json', encoding='utf-8') as fh:
              providers = json.load(fh)['AppSetting'].get('AuthenticationProviders', [])

          configured = {(p.get('Key') or '').lower() for p in providers}

          # Ocelot validates both AuthenticationProviderKey and AuthenticationProviderKeys.
          required = set()
          for route in routes:
              opts = route.get('AuthenticationOptions') or {}
              for key in opts.get('AuthenticationProviderKeys') or []:
                  if key:
                      required.add(key)
              single = opts.get('AuthenticationProviderKey')
              if single:
                  required.add(single)

          missing = sorted(k for k in required if k.lower() not in configured)
          if missing:
              print("::error::ocelot.json routes reference authentication providers that are "
                    "not configured in appsettings.json: " + ", ".join(missing))
              print("::error::Ocelot refuses to start in that state. Either declare the provider "
                    "under AppSetting:AuthenticationProviders or drop it from the route.")
              sys.exit(1)

          print(f"OK: {len(required)} provider reference(s) resolve to configured providers.")
          PY

      # Boots the published binary for real: no ocelot.json is shipped, so this also proves
      # the file is generated on first run. A minimal appsettings.json supplies the one
      # authentication provider Ocelot needs to start.
      - name: Verify the gateway starts and answers /health
        run: |
          set -e
          export ASPNETCORE_ENVIRONMENT=Production

          rm -f ./publish-out/ocelot.json

          cat > ./publish-out/appsettings.json <<'JSON'
          {
            "Logging": { "LogLevel": { "Default": "Warning" } },
            "AppSetting": {
              "AuthenticationProviders": [
                { "Key": "JWT", "Type": "jwt", "SecretKey": "ci-only-not-a-secret-ci-only-not-a-secret" }
              ],
              "AdminApi": { "SigningKey": "ci-only-not-a-secret-ci-only-not-a-secret", "Enable": true }
            },
            "PluginMetadata": {}
          }
          JSON

          dotnet ./publish-out/ApiGateway.dll --urls http://127.0.0.1:5080 > startup.log 2>&1 &
          PID=$!

          for i in $(seq 1 30); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::The gateway exited before /health became available."
              cat startup.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:5080/health >/dev/null 2>&1; then
              echo "Health endpoint responded:"
              curl -fsS http://127.0.0.1:5080/health
              kill "$PID" 2>/dev/null || true

              if [ ! -f ./publish-out/ocelot.json ]; then
                echo "::error::ocelot.json was not generated on first run."
                exit 1
              fi
              echo "OK: ocelot.json generated at startup."
              exit 0
            fi
            sleep 2
          done

          echo "::error::The gateway did not answer /health in time."
          cat startup.log
          echo "--- listening sockets ---"
          (command -v ss >/dev/null && ss -ltnp) || true
          kill "$PID" 2>/dev/null || true
          exit 1

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only (never push) so pull requests cannot publish images.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ocelot-admin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          set -e
          # The key must be at least 32 characters (AdminApiSetting.MinSigningKeyLength).
          docker run -d --name smoke -p 8080:8080 \
            -e AppSetting__AdminApi__SigningKey="ci-test-signing-key-32-chars-minimum" \
            ocelot-admin:ci

          echo "Waiting for the health endpoint..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "Health endpoint responded:"
              curl -fsS http://localhost:8080/health
              docker rm -f smoke
              exit 0
            fi
            sleep 2
          done

          echo "::error::Container did not become healthy in time"
          docker logs smoke
          docker rm -f smoke
          exit 1
